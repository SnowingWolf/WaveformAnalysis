schema_version: 2

# 生产站点使用显式页面白名单。schema v2 的 source_dirs 仍由解析器支持，
# 但不在这里使用，避免分析草稿、执行计划和内部文档被意外发布。
sections:
  - id: user-guide
    title: 用户指南
    nav_weight: 5
    index_route: user-guide/index.html
    source_indexes:
      - docs/user-guide/README.md
    pages:
      - source: docs/user-guide/QUICKSTART_GUIDE.md
        route: user-guide/QUICKSTART_GUIDE.html
      - source: docs/user-guide/EXAMPLES_GUIDE.md
        route: user-guide/EXAMPLES_GUIDE.html

  - id: contexts-reference
    title: Context 与适配器
    nav_weight: 10
    index_route: contexts/index.html
    pages:
      - route: contexts/context.html
        title: Context
        tag: reflect
      - route: adapters/adapter.html
        title: DAQ 适配器
        tag: reflect

  - id: plugin-system
    title: 插件系统
    nav_weight: 20
    index_route: plugins/guides.html
    source_indexes:
      - docs/plugins/README.md
    pages:
