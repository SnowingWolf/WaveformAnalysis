  acceptance_criteria:
  - 缓存查找和命中统计收敛为单一路径；多 run、lineage、命中计数及 readonly 行为保持。
  - 结果仅由显式 (run_id, name) 存取；迁移仓库调用方，清除自动结果属性及无 run 属性回退，保留用户自有属性。 resolve_dependencies 不跨 run 推测；显式注入使用现有内部
    _set_data，不新增公共写入接口。
  - 消除执行计划冷路径重复版本验证；计划缓存命中仍验证，版本错误不被宽泛 ValueError 兜底吞掉。保留五类必要失效事件及版本 proof，不新增冗余身份状态；覆盖动态依赖、provider 覆盖、配置与
    run_config 变更、只读与可写切换及 preview_execution 错误返回边界。
  - 内置 Memmap 与 SQLite Storage 调用统一接受 run_id；Context 不再探测存储运行时签名，明确迁移自定义 backend 契约。 保持后端各自 run_id=None
    列举语义及现有键布局，外部自定义 backend 迁移至接受 run_id 关键字。
  - 保留事件 pair_id 关联、位置异常传播、依赖版本强约束；无越权 public API 删除。
  - 定向测试、固定四条生成/impact/schema 门禁、文档同步与锚点、独立文档站点构建、独立阻断审查通过；仅 root scoped 提交。
  - 缓存数据可能可读而完整依赖 DAG 缺失；preview_execution 在缺失完整 DAG 时返回 error，不以缓存可读替代完整依赖图验证。该边界源于移除宽泛 ValueError fallback。
