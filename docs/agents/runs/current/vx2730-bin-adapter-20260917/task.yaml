    scope_in:
    - Parse CoMPASS 0xCAEx header variants and fixed-length events via memmap.
    - Emit int64 2D arrays with the VX2730 CSV column layout so the generic records builder is reused
      unchanged.
    - Case-insensitive RAW/*.BIN layout; CH<n> files grouped per channel, other files grouped as channel
      0 (single-file multi-channel).
    - Reject st_waveforms for vx2730_bin (records input_source and st_waveforms plugin).
    scope_out:
    - Writing CoMPASS flags into records.flags (user decision).
    - st_waveforms support for binary input (user decision).
    - Public site docs (QUICKSTART / site catalog) because they require a full site baseline and site_dist
      rebuild.
    - Pre-existing ErrorManager.collect_context shadowing bug.
  user_decisions:
    adapter_name: vx2730_bin
    pipeline_scope: records / wave_pool via raw_files only
    compass_flags_in_records: not written
  required_gates:
  - assess_change_impact
  - schema_compat_check
  - doc_sync
  - doc_anchors
  - targeted_tests
  - full_test_suite
  executor_role: executor.code
  assignment:
    planner_role: planner
    executor_role: executor.code
    reviewer_role: reviewer
  acceptance_criteria:
  - get_adapter("vx2730_bin") and get_format_reader("vx2730_bin") are registered.
  - Real CoMPASS file (10 dB LED run) builds 100121 records with event_length 752, dt 2 ns, 1 ms timestamp
    spacing and baseline around 8180 ADC.
  - Header variants, chunking, empty/truncated/invalid files and layout grouping are covered by tests.
  - Existing adapters behave unchanged; public surface snapshot updated.
