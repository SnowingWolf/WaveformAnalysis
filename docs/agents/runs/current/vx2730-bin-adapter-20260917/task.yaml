    - waveform_analysis/acquisition/formats/vx2730_bin.py
    - waveform_analysis/acquisition/formats/__init__.py
    - waveform_analysis/utils/formats/__init__.py
    - waveform_analysis/core/plugins/builtin/records/_compute.py
    - waveform_analysis/core/plugins/builtin/st_waveforms/plugin.py
    - docs/plugins/reference/agent/st_waveforms.md
    - docs/plugins/reference/builtin/auto/st_waveforms.md
    - tests/test_daq_adapter_vx2730_bin.py
    - tests/daq_adapter_helpers.py
    - tests/contracts/utils_public_surface.json
