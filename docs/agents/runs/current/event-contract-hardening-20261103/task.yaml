      by actual guide-source changes. context_cache.py is permitted only if existing
      plan/constraint validation cache invalidation must follow set_config or plugin
      override; retain valid unconstrained cached-only reads with unregistered upstream
      providers. context_config.py is permitted only for request-version proof invalidation
      at existing configuration refresh/freshness boundaries. Generated plan INDEX/active
      registry views may change only through render_agent_docs.py for this task.
    commit: 'Root integrates, completes required validation and blocking Reviewer,
