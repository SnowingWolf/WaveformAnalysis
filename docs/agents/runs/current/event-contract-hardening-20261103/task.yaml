      if implementation changes the numerical algorithm/path beyond the stated join,
      revisit MINOR before completion.
  contracts:
    events:
    - Association scope is selected pairs only; unselected pair rows do not produce
      events or require positions.
    - Keep original selected-pair ordering, event_id/event_number enumeration and
      all current scalar calculations; reorder positions once before copying fields
      and applying flags.
    - Validate integer pair identity at this relation boundary; do not coerce floating
      IDs into integer IDs or impose new positivity/global-ID rules.
    - Require a one-to-one mapping with no duplicate/missing/extra IDs. Both sides
      empty is the only empty relation. Error text identifies product and offending
      membership condition.
    - NaN positions with nonvalid flags are legitimate reconstruction results and
      remain attached to their matching pair.
    - Mixed signed/unsigned integer identities are lossless throughout sorted membership
      comparison, alignment and diagnostics. Do not rely on cross-dtype np.searchsorted/np.array_equal/set
      operations that can promote wide integer values to float64.
    - Use sorting ranks/inverse permutation or an equivalently exact local integer
      join. Preserve the existing selected order and all associated position flags
      for adjacent IDs above 2**53; distinguish adjacent unequal IDs across signed/unsigned
      representations.
    position_reconstruction:
    - Only consumed peaklet_channels input is validated; preserve no-selection/all-below-threshold
      early returns.
    - Consumed channel input is a 1-D structured ndarray with peaklet_id, board, channel
      integer fields and area real numeric field; compatible integer widths/real numeric
      widths may differ.
    - A typed zero-row channel array is legitimate absence. None/non-array and missing/incompatible
      schema are failures rather than absence.
    - Preserve unknown-hardware, no matching peaklet, nonpositive contribution, NaN
      propagation and duplicate-layout-key semantics already covered by numerical
      equivalence tests.
    - Unexpected get_data exception retains its type/message and is not caught as
      a physical missing-signal result.
    dependency_versions:
    - Existing-provider consumer registration mismatch is a blocking validation error
      without partially replacing the registry or invalidating caches.
    - Consumer-before-provider order and provider override must be covered at a mandatory
      target/run-aware plan or request boundary; no incompatible computation or stale
      memory/disk result may be returned.
    - Resolve run-specific dynamic constraints using the request run_id, not only
      registration-time run_id=None; preserve supported legacy resolver signatures.
    - Reuse the existing execution-plan cache and registry/config invalidation for
      repeated checks; the common no-constraint cache-read path stays lightweight.
    - Do not validate unrelated consumers or introduce missing-plugin failures for
      valid cached data that has no declared version constraint.
    - Missing validator/invalid explicit spec or constrained provider version must
      fail clearly, without new silent fallback; packaging stays optional for unconstrained
      paths.
    - Invalidate request-version validation proofs at the existing run-config refresh/freshness
      boundaries as well as normal set_config/registration invalidation. A previously
      validated (run_id, target) cannot remain trusted after get_run_config(refresh=True)
      reloads a changed config.
    - Readonly external config and persisted freshness-state refresh must invalidate
      stale proofs before validation and disk result return, including a reused Context/BatchProcessor.
      Do not add config writes, result computation or cache deletion to readonly requests.
    - Use the existing config cache/freshness observations for invalidation; no run_config-in-lineage
      redesign, new persistence store, full-file hashing for progress, or repeated
      DAG traversal on unchanged warm reads.
  execution_backend_decision:
    backend: numpy
    backend_reason: ID alignment and schema checks operate on existing arrays; preserve
      the existing vectorized CoG backend. Version checks are small Python control
      flow.
    parallel_scope: none
    worker_option: none
    fallback_path: No fallback for invalid contracts or unexpected exceptions. Preserve
      documented typed-empty and nonreconstructable-signal results.
    benchmark_required: false
    benchmark_reason: Correctness fix without performance claim or new execution backend;
      validate matched numerical results using existing equivalence regression.
