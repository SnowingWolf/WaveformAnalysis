  acceptance_criteria:
  - events preserves selected-pair input order and aligns every position value and
    position-derived quality flag by pair_id, including reordered/nonconsecutive IDs;
    existing event dtype, IDs, timing units and topology placeholders remain unchanged.
  - Selected pair IDs and position pair IDs are unique and have exactly equal membership.
    Duplicate selected IDs, duplicate positions, missing positions and extra positions
    fail clearly. Empty selected pairs with empty typed positions return empty EVENT_DTYPE;
    only one side empty is a membership error.
  - position_reconstruction propagates unexpected upstream get_data failures. Non-array,
    non-1D/unstructured, missing-field or incompatible identity/area schema from a
    consumed peaklet_channels input fails clearly, including malformed empty input;
    no broad exception-to-NaN fallback remains.
  - Legitimate no-selection, all-S2-below-threshold, valid empty peaklet_channels,
    absent matching channel contributions and nonpositive/unknown-hardware contributions
    keep their current empty/NaN and flag semantics. Existing CoG numerical equivalence,
    duplicate-S2 refill, duplicate-layout-key and drift-unit tests pass.
  - Explicit dependency version constraints are enforced rather than logged-and-ignored;
    incompatible already registered providers reject consumer registration without
    partial registry mutation. Registration order, provider override and run-dependent
    dynamic constraints cannot permit incompatible compute or invalid cached-result
    retrieval at the necessary request/plan boundary.
  - Compatible constraints, unconstrained dependencies, normal registry override/cache
    invalidation and legacy run-independent resolver signatures continue to work.
    Reuse execution-plan/registry invalidation caches; do not rewalk the DAG on every
    memory hit or require absent unconstrained providers merely to read valid cache.
  - Constrained dependency checks cannot silently succeed if a required version validator
    is unavailable or a constrained provider version/spec is invalid. Keep the existing
    unconstrained semantic_version compatibility behavior outside this check; do not
    add a general dependency framework.
  - Plugin versions and manifests are synchronized, output schemas/units stay stable,
    generated Auto/Agent references and minimal behavior documentation match the final
    implementation; all required gates pass and an independent blocking Reviewer accepts
    before a scoped integration commit.
  - 'R1: After a dynamic run-aware constraint has been validated, both public get_run_config(run_id,
    refresh=True) after an external run-config edit and readonly external run-config
    plus persisted-state refresh invalidate the old version-validation proof before
    cached-result retrieval. An incompatible provider is rejected, while unchanged
    warm reads remain cached and readonly requests never compute or write.'
  - 'R2: pair_id association, equality and missing/extra membership diagnostics preserve
    exact integer values for mixed int64/uint64 inputs. Matching IDs above 2**53 retain
    distinct coordinates and position flags in selected order; adjacent unequal high
    IDs must raise a membership error rather than compare equal through float promotion.'
  - Generated agent task navigation is regenerated from task.yaml for the actual handoff/completion
    state; only this task entry is added/updated in docs/agents/plans/INDEX.md and
    docs/agents/plans/active.yaml, with manifest --check passing.
  - 'R3: Synchronize the Context.py-anchored docs/features/context/CONFIGURATION.md
    with the implemented dependency-version validation and run-config refresh/freshness
    semantics. Update its affected existing site-model fixture and content-baseline
    entries and regenerate the isolated packaged documentation as already planned;
    doc-sync/doc-anchor gates and site consumer validation must pass without this
    synchronization warning. Evidence: /tmp/wa-event-contract-hardening-20261103-02/review-round2.json;
    R1/R2 are resolved by the independent 72-test review, so do not expand code scope
    or alter existing version/acceptance decisions.'
