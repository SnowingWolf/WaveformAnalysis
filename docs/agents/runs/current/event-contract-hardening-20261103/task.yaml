  implementation_steps:
  - Implement the local events ID join and input membership validation, then add behavior
    regressions for order, flags, empty and broken membership.
  - Remove position get_data exception swallowing and validate consumed channel schemas;
    migrate None-as-empty mocks to a genuine typed empty table and add failure/absence
    regressions.
  - Make explicit dependency version failures propagate; cover late registration,
    override and run-aware request/plan boundaries using existing plan cache invalidation,
    including memory/disk hit cases.
  - Resolve blocking review R1 with config-refresh/freshness proof invalidation and
    its ordinary/readonly regressions; resolve R2 with exact mixed-integer association/membership
    and wide-ID regressions. Regenerate task navigation after lifecycle state changes.
  - Apply synchronized plugin versions/manifests and minimal behavior documentation,
    regenerate Auto and Agent references, run directional and mandated gates.
  - Record execution evidence, transition to reviewing, obtain independent blocking
    review/rework, and only after acceptance finish task handoff plus scoped commit.
