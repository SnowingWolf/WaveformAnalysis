  review_focus:
  - One-to-one IDs and reordering apply equally to coordinate fields and all position-dependent
    flags; no valid pair silently disappears.
  - Only physical/reconstruction absence returns NaN; corrupted schema/upstream failure
    is distinguishable and visible.
  - Version enforcement is atomic when registration fails, run-aware, resistant to
    override/cache bypass and inexpensive for repeated/unconstrained reads.
  - No unrelated API deletion, new generic framework, numerical/placeholder/unit changes
    or extra concurrency; version/manifests/docs/schema gates agree.
  - Every strict blocking gate has PASS/FAIL evidence and the scoped commit/handoff
    matches actual changed paths.
  - 'R1: Repeat both Reviewer reproductions after the fix, verify new config freshness
    cannot reuse an old version-check proof, and retain warm-hit efficiency plus readonly
    no-write/no-compute behavior.'
  - 'R2: Review exact integer association and membership comparison together; correcting
    only cross-dtype searchsorted is insufficient if equality/missing/extra checks
    can still collapse adjacent wide IDs.'
  - Generated navigation reflects the final task state, with only this task registry
    entry changed and no hand edits to generated views.
  blocking_assumptions: []
  risks:
  - Previously tolerated malformed custom providers/fixtures will now raise; migrate
    only legitimate empty fixtures and document the failure boundary.
  - Position ordering bugs can also affect quality flags, so testing coordinates alone
    is insufficient.
  - Registration-only version checks miss consumer-first/run-dependent/override cases;
    full-DAG revalidation per memory hit would add unnecessary overhead and can break
    valid cached-only access.
  - Existing Plugin.semantic_version returns 0.0.0 for malformed versions; constrained
    checking must not mistake that compatibility fallback for a valid provider version.
  - 'No real DAQ or end-to-end physical efficiency claim: synthetic contract tests
    plus existing numerical equivalence regressions bound validation.'
