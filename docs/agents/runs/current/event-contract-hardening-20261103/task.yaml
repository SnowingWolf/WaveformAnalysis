  version_action:
    events: '0.0.3 -> 0.1.0: conservative MINOR for new explicit ID join/validation
      path; synchronize manifest and metadata tests.'
    position_reconstruction: '0.4.0 -> 0.4.1: PATCH for transparent upstream/schema
      errors, unchanged CoG algorithm and successful/legitimate-absence results; synchronize
      manifest and metadata tests.'
