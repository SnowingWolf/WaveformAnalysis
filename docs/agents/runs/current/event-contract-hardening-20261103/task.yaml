    documentation: Edit source/class behavior descriptions and minimal contract guides
      only as needed, then regenerate affected Auto/Agent references. If site-consumed
      guides change, synchronize only corresponding source/model baseline and fixture
      entries; perform isolated docs build/staging for the corresponding packaged
