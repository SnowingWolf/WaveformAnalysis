      legacy_form: waveform_analysis.utils.cli_docs
      runtime_surface: public_python_module_and_cli_module_entrypoint
      delete_action: remove
      risk_level: high
      migration_note: 更新所有仓库 caller、CI、Makefile 和测试为 canonical module；clean wheel
        断言旧 import 不存在，保留 waveform-docs console script 的 canonical entrypoint。
    - compat_id: utils_context_help_alias
