  compat_inventory:
    task_id: waveform-doc-system-opt-20260831
    route: retire_compat
    inventory_scope: 已批准的文档发布兼容面：七个 utils 文档 alias、Jinja HTML site generator、 plugins-web
      CLI、旧 HTML redirect/route 和 file:// 直接打开约定。
    canonical_policy: Next.js static export 是唯一 HTML site producer；`waveform_analysis.documentation`
      仅保留 canonical agent/Markdown facts and checks；不保留 alias、redirect、双轨 renderer
      或 file:// fallback。所有旧 URL 只进入 docs/site-route-migration.yaml。
    user_decision:
      full_redesign: approved
      tracked_reproducible: approved
      remove_legacy: approved
      delivery: commit
    compat_items:
    - compat_id: utils_cli_docs_alias
