      risk_level: high
      migration_note: Context 已经从 documentation.context_help 导入；迁移测试和 monkeypatch
        到 canonical module，并用 clean-process import failure 证明 alias 未保留。
    - compat_id: utils_doc_coverage_alias
      kind: public_python_api
      canonical_form: waveform_analysis.documentation.doc_coverage
      legacy_form: waveform_analysis.utils.doc_coverage
      runtime_surface: public_python_module_and_quality_check
      delete_action: remove
      risk_level: high
      migration_note: 覆盖率检查改用 canonical import；保留 strict/fail-on-warning 语义，删除 utils
        alias。
    - compat_id: utils_doc_links_alias
      kind: public_python_api
      canonical_form: waveform_analysis.documentation.doc_links
      legacy_form: waveform_analysis.utils.doc_links
      runtime_surface: public_python_module_and_link_checker
      delete_action: remove
      risk_level: high
      migration_note: 链接检查测试和 CLI 直接导入 canonical module；新 Next route/link checker
        作为 site gate 接入，不添加旧 alias。
    - compat_id: utils_plugin_doc_generator_alias
      kind: public_python_api
      canonical_form: waveform_analysis.documentation.plugin_doc_generator
      legacy_form: waveform_analysis.utils.plugin_doc_generator
      runtime_surface: public_python_module_and_plugin_markdown_generation
      delete_action: remove
      risk_level: high
      migration_note: '`plugins-auto`/`plugins-agent` 迁移到 canonical import；仅保留 Markdown/facts
        能力， 旧 web/Jinja `generate_web` 单独删除并由 Next site-web 接管。'
    - compat_id: utils_site_doc_generator_alias
      kind: public_python_api
      canonical_form: docs/site-next plus waveform-docs generate site-web
      legacy_form: waveform_analysis.utils.site_doc_generator
      runtime_surface: public_python_module_and_full_html_site_generation
      delete_action: remove
      risk_level: high
      migration_note: 不保留 DocumentationSiteGenerator 类 API；调用方迁移到 site-web build contract，
        Next 输出使用 extensionless public routes，旧 Python HTML generator 不作 fallback。
    - compat_id: utils_site_guides_alias
      kind: public_python_api
      canonical_form: waveform_analysis.documentation.site_guides or versioned Next
        route data contract
      legacy_form: waveform_analysis.utils.site_guides
      runtime_surface: public_python_module_and_navigation_manifest_parser
      delete_action: remove
      risk_level: high
      migration_note: 迁移 manifest/frontmatter 事实到 canonical data adapter；不保留 utils
        alias，不让旧 HTML renderer 继续消费旧 route 字段，路由冲突/缺失在 Next build 阶段失败。
    - compat_id: documentation_site_generator_jinja_chain
      kind: html_renderer_compat
      canonical_form: Next.js static export invoked by site-web
      legacy_form: DocumentationSiteGenerator, waveform_analysis.documentation.site_docs.generator,
        waveform_analysis.documentation.site_doc_generator, templates/web/**/*.j2,
        and PluginDocGenerator.generate_web
      runtime_surface: public_offline_html_site_and_build_pipeline
      delete_action: remove
      risk_level: high
      migration_note: 先完成 Next data/build adapter 与 output/link tests，再删除全部 Jinja
        web templates、 old renderer and generate_web; retain only non-HTML plugin
        Markdown/facts generation.
    - compat_id: plugins_web_cli
      kind: public_cli
      canonical_form: waveform-docs generate site-web
      legacy_form: waveform-docs generate plugins-web and cli generate_plugins_web
        branch/choice
      runtime_surface: public_cli_command_and_docs_ci_entry
      delete_action: remove
      risk_level: high
      migration_note: 从 argparse choices、dispatch、tests、docs、Makefile/CI 中移除；site-web
        全量输出 同时覆盖插件内容，命令不存在不得静默转发。
    - compat_id: legacy_html_redirects
      kind: public_route_redirect
      canonical_form: docs/site-route-migration.yaml entries to extensionless Next
        routes
      legacy_form: generated redirects plugins/system.html, plugins/template-api.html,
        plugins/authoring.html, contexts/records-wave-pool.html, architecture/CONTEXT_PROCESSOR_WORKFLOW.html,
        and features/advanced/EXECUTOR_MANAGER_GUIDE.html
      runtime_surface: public_site_urls_and_search/navigation
      delete_action: remove
      risk_level: high
      migration_note: 只写旧 route -> 新 route 映射；不生成 HTML redirect、window.location、meta
        refresh， 不把旧 URL 放入 search index 或 navigation。
    - compat_id: legacy_html_route_suffixes
      kind: public_route_format
      canonical_form: extensionless Next routes with static export index.html implementation
        detail
      legacy_form: current site-guides.yaml and generated links ending in .html
      runtime_surface: public_site_route_contract_and_internal_links
      delete_action: remove
      risk_level: high
      migration_note: 更新 manifest、Markdown links、search payload、tests and browser
        checks；旧 `.html` route family must be absent from public navigation/output
        and fully listed in migration map。
    - compat_id: file_url_site_access
      kind: runtime_compatibility
      canonical_form: site-web generated static export served by documented local
        HTTP/static host
      legacy_form: opening generated HTML directly with file:// as an implicit supported
        contract
      runtime_surface: offline_site_runtime_and_asset_resolution
      delete_action: remove
      risk_level: medium
      migration_note: 不保留 file:// 兼容承诺；Next build and `waveform-docs serve`/static
        host are the supported preview paths，所有 assets/data requests must be same-origin
        and locally packaged。
    - compat_id: legacy_plugin_set_image_producer
      kind: build_asset_compat
      canonical_form: docs/site-next locally bundled visual system
      legacy_form: examples/generate_plugin_set_images.py writing templates/web/assets/plugin-sets
      runtime_surface: legacy_jinja_only_asset_generation
      delete_action: remove
      risk_level: low
      migration_note: 该脚本只写入已删除的 Jinja 资产目录，Next 数据模型与 UI 不消费这些 PNG；随旧 renderer 一并删除，不保留失效入口。
  high_risk_items_redirected: true
  high_risk_redirect_note: public CLI/module/route removals are handled as explicit
    strict migration workstreams with user confirmation, impact/schema/clean-wheel
