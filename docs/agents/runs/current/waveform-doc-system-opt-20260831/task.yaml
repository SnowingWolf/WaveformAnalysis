spec:
  goal: 将 WaveformAnalysis 离线文档系统全量重构为 Next.js 静态站点：保留 `waveform-docs generate site-web`
    作为唯一 HTML 入口，删除已批准的七个 `waveform_analysis.utils` 文档兼容 alias、Jinja HTML 生成链、 `plugins-web`
    CLI 及旧 `.html` redirect，并只留下可审计的迁移映射。
  route: retire_compat
  workflow_cost: strict
  workflow_shape: staged
  risk_level: high
  scope:
    base_sha: 59438b87c23d48493cbfd6fe71ab3fb91452bc98
    allowed_paths:
    - waveform_analysis/documentation
    - waveform_analysis/utils
    - docs/site-next
    - docs/site-react
    - docs/cli
    - docs/agents
    - docs/architecture/README.md
    - docs/site-guides.yaml
    - docs/site-route-migration.yaml
    - tests
    - scripts
    - .github
    - pyproject.toml
    - .gitignore
    - Makefile
    - examples/generate_plugin_set_images.py
  scope_in:
  - 新建并提交 `docs/site-next` Next.js 应用，产出离线静态站点；采用当前已批准的 精密科学仪器视觉方向，覆盖导航、搜索、插件/Context/Accessor/可视化参考、谱系图、
    代码展示、响应式与无障碍交互。
  - 将 `site-web` 改为 Next 静态构建、完整性/本地链接校验和原子发布的唯一 HTML 入口；构建期间不再调用 Jinja renderer 或旧
    Vite bundle。
  - 删除清单中七个 `waveform_analysis.utils` 文档模块及其调用方兼容 import，迁移 内部代码、测试、Makefile、CI 和维护文档到
    canonical documentation 入口。
  - 删除 Jinja web templates、`DocumentationSiteGenerator` 的旧 HTML 生成实现及 `PluginDocGenerator.generate_web`
    路径；保留仍被 agent/builtin Markdown 文档链需要的 canonical facts、schemas 和非 HTML 生成能力。
  - 删除只为旧 Jinja `plugin-sets` 图片目录生产资源的 `examples/generate_plugin_set_images.py`；Next
    站点不消费该离线脚本或其旧资产。
  - 同步由本 task 记录机械生成的 `docs/agents/plans/INDEX.md` 与 `docs/agents/plans/active.yaml`；不修改其生成器或协议语义。
  - 删除 `plugins-web` 公共 CLI 选择、分支、测试和文档；更新 `site-guides.yaml`/Next 路由为 canonical 路径，并建立一份旧路径到新路径的迁移映射文件，不生成
    redirect。
  - 保留插件契约、dtype、分析/DAQ 逻辑、缓存 lineage、Agent 文档协议和 `plugins-auto`/`plugins-agent` 语义；仅迁移其文档消费入口。
  scope_out:
  - waveform_analysis 插件 provides/depends_on/options/output_dtype、算法和数据契约。
  - Context、Accessor、DAQ、分析、缓存存储和 lineage 运行时行为。
  - '`docs/agents` 中除本 task 记录及其两个机械生成计划视图外的协议、历史归档和导航内容。'
  - 旧 HTML redirect、旧 `.html` URL 兼容层以及 `file://` 直接打开承诺；迁移映射是唯一保留物。
  - 与本次站点路由迁移无关的 README 内容清理、业务文档重写和生成的 `docs/_site` 入库。
  acceptance_criteria:
  - '`waveform-docs generate site-web` 在干净环境中成功构建 Next 静态导出并原子发布到 目标目录；完整性检查、路由边界检查和本地链接/锚点检查通过，且不执行
    Jinja HTML 链。'
  - '`waveform-docs generate plugins-web` 不再是可用命令；源码、CI、Makefile、测试和 活跃文档不再引用它，`site-web`
    是唯一全量 HTML 生成入口。'
  - 七个 `waveform_analysis.utils` 文档 alias 文件从源码和 clean wheel 中消失；内部 caller/test 使用
    `waveform_analysis.documentation` canonical 路径，canonical Markdown/agent 文档生成与覆盖检查仍通过。
  - '`DocumentationSiteGenerator`、Jinja `templates/web/**` 和 `PluginDocGenerator.generate_web`
    旧路径被移除或替换为 Next 数据/build adapter； 不存在旧 renderer 的隐式 fallback。'
  - 旧 `.html` redirect 文件、`window.location`/meta-refresh 兼容实现和旧 route aliases 均不进入
    Next 输出；迁移映射完整覆盖旧 route family，并为每条映射指定 canonical extensionless route 或明确的人工迁移动作。
  - Next 站点保留现有 36 个插件的事实、配置、dtype/字段、Context/Accessor/可视化参考、 搜索和 lineage 交互；所有运行时静态资源本地打包，不访问
    CDN 或外部网络。
  - 精密科学仪器视觉方向在桌面和窄屏通过截图/浏览器验收：信息密度、测量网格、状态/信号 色彩、键盘焦点、语义标题、对比度和 reduced-motion 行为均有可复核证据。
  - Python 定向测试、Next typecheck/build、路由/无旧兼容负向测试、文档链接/覆盖率、 agent docs、影响面和 schema
    smoke gate 全部通过；不得改动插件/数据/缓存契约。
  - 完成后只提交本任务范围内改动，Executor 与 Reviewer 在 task status 中记录完整命令、 gate 结果、剩余风险和 commit
    SHA。
  required_gates:
  - compat_inventory_ready
  - deletion_scope_confirmed
  - user_confirmation_recorded
  - next_typecheck
  - next_static_export
  - site_web_unique_entry
  - route_migration_completeness
  - no_legacy_redirects
  - no_plugins_web_cli
  - removed_utils_imports
  - canonical_doc_generation
  - strict_doc_coverage
  - doc_links
  - browser_review
  - responsive_accessibility
  - offline_asset_check
  - doc_sync
  - doc_anchors
  - assess_change_impact
  - schema_compat_check
  - clean_wheel_packaging
  - diff_scope_check
  - handoff_check
  assignment:
    planner_role: planner
    executor_role: executor.config
    reviewer_role: reviewer
    controller: /root
    execution_sequence:
    - luna_next_contract: freeze Next data schema, canonical route matrix, and static-export
        boundary
    - luna_next_frontend: implement docs/site-next pages, precision-instrument UI,
        search, and lineage
    - luna_site_adapter: connect site-web to Next build/export and atomic publish;
        remove Jinja path
    - luna_compat_retirement: remove seven utils aliases, generate_web, plugins-web,
        and redirects
    - luna_tests_ci_docs: migrate tests/CI/docs, add negative compatibility and clean-wheel
        checks
    - luna_integration: run full strict gates and produce scoped execution evidence
    - luna_blocking_reviewer: independently review diff, gates, migration inventory,
        and handoff
    parallel_tracks:
    - next_frontend_and_data_contract_after_route_matrix
    - compatibility_inventory_test_migration
    serialization_rules:
    - Freeze route/data contracts and capture a clean baseline before destructive
      deletions.
    - Land Next build output and site-web integration before deleting Jinja/templates
      or old aliases.
    - Update all callers/tests/CI/docs before removing the seven module files and
      plugins-web choice.
    - Run no-legacy-route, clean-wheel, browser, doc, impact, schema and handoff gates
      only after all tracks merge.
  execution_plan:
    implementation_contract:
      app_root: docs/site-next
      canonical_cli: waveform-docs generate site-web
      output_contract: static Next export atomically published to requested output
        directory
      canonical_url_style: extensionless routes; route/index.html may be a physical
        export detail, not a public legacy URL
      migration_map: docs/site-route-migration.yaml
      runtime: offline local assets; no CDN, server-side dynamic dependency, or file://
        guarantee
    data_and_routes:
    - Export validated plugin/context/accessor/visualization facts as a versioned
      Next input contract.
    - Convert current site-guides navigation into one canonical route registry consumed
      by Next.
    - Record every existing public `.html` family and six generated redirect pages
      in the migration map.
    - Fail on duplicate routes, missing providers, stale search URLs, broken fragments,
      or output escape.
    removal_order:
    - Capture current generation/test baseline and freeze route map.
    - Implement and validate Next static site plus site-web adapter.
    - Migrate callers/tests/CI/docs to canonical paths and new routes.
    - Remove compatibility inventory items with delete_action remove.
    - Run strict review gates and commit only scoped changes.
    mandatory_commands:
    - /home/wxy/anaconda3/envs/pyroot-kernel/bin/python -m pytest -q <targeted documentation
      and CLI tests>
    - npm ci --prefix docs/site-next
    - npm run check --prefix docs/site-next
    - npm run build --prefix docs/site-next
    - /home/wxy/anaconda3/envs/pyroot-kernel/bin/python -m waveform_analysis.documentation.cli
      generate plugins-auto -o docs/plugins/reference/builtin/auto/
    - /home/wxy/anaconda3/envs/pyroot-kernel/bin/python -m waveform_analysis.documentation.cli
      generate plugins-agent -o docs/plugins/reference/agent/
    - /home/wxy/anaconda3/envs/pyroot-kernel/bin/python -m waveform_analysis.documentation.cli
      check links --docs-dir docs
    - /home/wxy/anaconda3/envs/pyroot-kernel/bin/python -m waveform_analysis.documentation.cli
      check coverage --strict --fail-on-warning
    - /home/wxy/anaconda3/envs/pyroot-kernel/bin/python scripts/assess_change_impact.py
      --base 59438b87c23d48493cbfd6fe71ab3fb91452bc98
    - /home/wxy/anaconda3/envs/pyroot-kernel/bin/python scripts/schema_compat_check.py
