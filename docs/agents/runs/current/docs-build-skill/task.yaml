    Add .agents/skills/docs-build/SKILL.md and scripts/docs_build.py. Read skill-creator
    instructions /home/wxy/.codex/skills/.system/skill-creator/SKILL.md and update-docs
    skill as needed. .agents is gitignored: add narrowly scoped .gitignore exceptions
