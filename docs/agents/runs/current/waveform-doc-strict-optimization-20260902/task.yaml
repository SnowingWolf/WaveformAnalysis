spec:
  goal: 在不牺牲完整文档内容和静态直达路由的前提下，严格优化 Next.js 文档站的搜索/RSC 负载、Markdown 指南保真、桌面交互、Lineage
    定位与构建可复现性。
  route: modify_code
  workflow_cost: strict
  workflow_shape: staged
  risk_level: high
  scope:
    base_sha: e5944fa30eae19240c491eaeaaec5415f420c45e
    allowed_paths:
    - docs/site-next
    - docs/site-guides.yaml
    - docs/site-content-baseline.json
    - docs/cli/WAVEFORM_DOCS.md
    - docs/agents/plans/INDEX.md
    - docs/agents/plans/active.yaml
    - docs/agents/runs/current/waveform-doc-strict-optimization-20260902/task.yaml
    - waveform_analysis/documentation/site_model.py
    - waveform_analysis/documentation/site_web.py
    - waveform_analysis/documentation/schemas/SiteModel.schema.json
    - waveform_analysis/documentation/site_dist
    - scripts/build_docs_site_dist.py
    - tests/test_site_model.py
    - tests/test_site_guides.py
    - tests/test_cli_docs_site_publish.py
  acceptance_criteria:
  - 33 个公开 Markdown 指南及全部 rich reference 页面保留有序段落、链接、列表、多代码块、表格与 source index 可点击入口，并有独立源指纹覆盖门禁。
  - 完整搜索索引不再进入每页 Client Shell；搜索首次打开时加载 canonical 静态索引，支持章节锚点、上下键、Enter、Escape、焦点约束和错误回退。
  - 在桌面导航矩阵通过后过滤不需要的 RSC .txt；静态站总大小不高于 80 MiB，且直达、点击、前进后退、硬刷新、搜索与 404 均正常。
  - Lineage 正确消费 focus 参数、静态模式不请求不存在的 API、无效控件被实现或移除；页面标题与插件版本准确。
  - Next 类型检查、单测、两次确定性导出、Python/文档/影响/schema gate、桌面 Firefox QA 与最小窄屏不崩坏检查全部通过。
  required_gates:
  - scope_check
  - content_model_tests
  - guide_content_baseline
  - search_index_lazy_loading
  - rsc_filter_compatibility
  - static_size_budget
  - next_typecheck
  - next_unit_tests
  - next_static_export
  - deterministic_build
  - desktop_browser_review
  - minimal_narrow_view_smoke
  - accessibility_review
  - metadata_review
  - assess_change_impact
  - schema_compat_check
  - doc_sync
  - doc_anchors
  - handoff_check
  assignment:
    planner_role: planner
    executor_role: executor.code
    reviewer_role: reviewer
    controller: /root
    planner: /root/docs_content_audit
    executors:
    - /root/docs_next_legacy_cleanup
    - /root/docs_next_frontend
    - /root
    reviewer: /root/docs_ux_a11y_audit
    execution_sequence:
    - 冻结 33 个公开 Markdown guide、rich reference、source index、路由、RSC 文件集与发布大小基线。
    - 先扩展 guide 有序内容 block、inline link 与独立 source/model fingerprint baseline，再修改 Next
      渲染。
    - 将 canonical 搜索索引移出 Client Shell，首次打开时按 fingerprint 懒加载，并补齐键盘与错误回退。
    - 修复桌面 Lineage focus、静态 API 请求、无效控件、metadata 与插件版本。
    - 仅在完整桌面导航矩阵通过后过滤已知 Next RSC .txt，并执行 80 MiB 与双构建确定性门禁。
    - Executor 写入执行证据后由独立 Reviewer 重跑阻断 gate；失败进入 rework_required。
  scope_in:
  - 保留现有 rich reference baseline，并为 33 个公开 Markdown guide 和 source index 增加独立源 SHA-256、模型
    fingerprint、block/link/code/table 计数和路由覆盖门禁。
  - Guide 模型与 Next renderer 保留 paragraph、heading、ordered/unordered list、多个 code block、table、link
    及现有 note/image 内容的原始顺序。
  - source index 正文进入公开 index 页面，目录链接必须可点击且指向 canonical route。
  - search-index.v1.json 由 site-model/v1 派生；Client Shell 仅携带导航、版本和带 fingerprint 的索引
    URL。
  - 搜索实现 loading、empty、error/retry、导航 fallback、ArrowUp/ArrowDown、Enter、Escape、focus
    trap 与 focus restore。
  - Lineage 在静态导出中不请求 /api/lineage，正确消费合法/非法 focus，并实现或移除无行为的桌面控件。
  - 发布只过滤明确识别的 Next RSC .txt，保留普通文本资产；manifest 在过滤后生成。
  - 最终发布目录全部普通文件总字节数不超过 83886080，并以有序 relative_path,size,sha256 清单证明两次独立导出一致。
  - 浏览器主验证固定为 Firefox 1440x1100；390x844 仅做首页、guide、plugin、Lineage 不崩坏 smoke。
  scope_out:
  - 33 个 Markdown 真源正文改写、canonical route 迁移和 legacy 路由恢复。
  - 插件运行时行为、dtype、缓存 lineage、公开 Python API 与算法版本。
  - 移动端信息架构、表格卡片化、抽屉体验或完整响应式重设计。
  - 恢复 Jinja、Mistune、Pygments 或旧 site-react 双轨生成链。
  - 提高 80 MiB 预算、忽略 TypeScript 错误或以删减正文换取体积。
  blocking_assumptions:
  - 当前 33 个公开 Markdown source、catalog rich facts 与 canonical routes 是内容真源；baseline
    更新必须由源字节与生成模型共同证明。
  - 当前站点内部导航使用原生 anchor；若浏览器矩阵发现任何被过滤 RSC 请求，立即停止过滤并保留完整导出。
  - Browser plugin 当前不可用，浏览器 gate 使用 Playwright Firefox fallback，并明确记录该工具边界。
  - systemd 只读取原子发布后的 tracked site_dist；任何 gate 失败都保留上一份完整发布产物。
  execution_plan:
    stage_s0_contract_freeze:
    - 记录 base SHA、工作区、33 guide、rich reference、source index、路由矩阵、RSC 文件与发布字节基线。
    stage_s1_content_model:
    - 扩展有序 guide block 与 inline link 契约，恢复 source index 正文。
    - 使用独立实现校验 raw Markdown SHA-256、规范化 block fingerprint 和结构计数。
    stage_s2_next_frontend:
    - 拆分 search-index.v1.json 与轻量 SiteShellModel，加入懒加载缓存、重试、键盘和焦点行为。
    - 修复 Lineage focus/static mode、metadata、真实插件版本和桌面无效控件。
    stage_s3_publish:
    - 在发布适配层过滤已知 RSC .txt，过滤后生成 manifest，执行路由、大小与两次导出 hash 门禁。
    stage_s4_review:
    - 独立 Reviewer 从 base SHA 复核 scope、内容指纹、所有路由、浏览器矩阵、确定性与全部 required gates。
