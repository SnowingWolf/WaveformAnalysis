name: Documentation Check

on:
  push:
    paths:
      - 'waveform_analysis/core/plugins/**'
      - 'waveform_analysis/documentation/**'
      - 'docs/site-next/**'
      - 'docs/plugins/**'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - 'waveform_analysis/core/plugins/**'
      - 'waveform_analysis/documentation/**'
      - 'docs/site-next/**'
      - 'docs/plugins/**'
      - '.github/workflows/docs-check.yml'

jobs:
  doc-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/site-next/package-lock.json

      - name: Install Next dependencies
        run: npm ci
        working-directory: docs/site-next

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docgen]"

      - name: Generate plugin documentation
        run: |
          python -m waveform_analysis.documentation.cli generate plugins-auto -o docs/plugins/reference/builtin/auto/
          python -m waveform_analysis.documentation.cli generate plugins-agent -o docs/plugins/reference/agent/

      - name: Check documentation coverage
        run: |
          python -m waveform_analysis.documentation.cli check coverage --strict --fail-on-warning

      - name: Build and validate Next static site
        run: |
          python -m waveform_analysis.documentation.cli generate site-web -o "${RUNNER_TEMP}/waveform-docs-site"

      - name: Check for uncommitted doc changes
        run: |
          git diff --exit-code -- docs/plugins/reference/builtin/auto/ docs/plugins/reference/agent/ || \
            (echo "::error::Generated plugin docs are out of date. Regenerate auto and agent references." && exit 1)

      - name: Upload generated docs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-plugin-docs
          path: |
            docs/plugins/reference/builtin/auto/
            docs/plugins/reference/agent/
            ${{ runner.temp }}/waveform-docs-site/
