repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        entry: python scripts/precommit/black_per_file.py
        args: [--line-length=100]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^waveform_analysis/documentation/templates/web/assets/elkjs-0\.11\.0\.bundled\.js$
      - id: end-of-file-fixer
        exclude: ^waveform_analysis/documentation/templates/web/assets/CYTOSCAPE-LICENSE\.txt$
      - id: check-yaml
      - id: check-added-large-files
